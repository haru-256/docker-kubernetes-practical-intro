# ---------------------------------------------------
#  Gateway (新規: 入り口の定義)
#    - 旧Ingressの annotations や TLS設定などを担当
# ---------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: taskapp-gateway
  namespace: taskapp
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same # 同じNamespace (taskapp) 内のRouteのみ許可

---
# ---------------------------------------------------
#  HTTPRoute (新規: ルーティング定義)
#    - 旧Ingressの rules や path を担当
# ---------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
  namespace: taskapp
spec:
  parentRefs:
    - name: taskapp-gateway # 上で作ったGatewayに紐付ける
  hostnames:
    - "localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web # 既存のService名
          port: 80
