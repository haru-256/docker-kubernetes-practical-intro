apiVersion: batch/v1
kind: Job
metadata:
  name: migrator-up
  labels:
    app: migrator
  namespace: taskapp
spec:
  # リトライ回数の上限（デフォルトは6）
  backoffLimit: 3
  # 以下の時間を過ぎたら、成功・失敗に関わらずJobを強制終了する設定（無限ループ防止の保険）
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: migrator
    spec:
      containers:
        - name: migrator
          image: ghcr.io/gihyodocker/taskapp-migrator:v1.0.0
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: taskapp
            - name: DB_USERNAME
              value: taskapp_user
          command:
            - "bash"
            - "/migrator/migrate.sh"
          args:
            - "$(DB_HOST)"
            - "$(DB_PORT)"
            - "$(DB_NAME)"
            - "$(DB_USERNAME)"
            - "/var/run/secrets/mysql/user_password"
            - "up"
          volumeMounts:
            - name: mysql-secret
              mountPath: /var/run/secrets/mysql
              readOnly: true
      volumes:
        - name: mysql-secret
          secret:
            secretName: mysql
      restartPolicy: Never # 失敗時にPodを新規に作成して実行
