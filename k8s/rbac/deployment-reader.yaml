apiVersion: v1
kind: Pod
metadata:
  name: deployment-reader
  namespace: rbac
  labels:
    app: deployment-reader
spec:
  serviceAccountName: pod-reader
  containers:
    - name: kubectl
      image: bitnami/kubectl:latest
      command: ["/bin/sh", "-c", "--"]
      args:
        - |
          while true; do
            echo "Listing deployments in namespace 'rbac':"
            kubectl get deployments -n rbac
            sleep 30
          done
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
        limits:
          cpu: 100m
          memory: 100Mi
